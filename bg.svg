<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
<defs>
  <linearGradient id="p1" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
    <stop offset=".45" stop-color="#58a6ff" stop-opacity=".34"/>
    <stop offset="1" stop-color="#7ee787" stop-opacity=".46"/>
  </linearGradient>
  <linearGradient id="p2" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
    <stop offset=".5" stop-color="#a78bfa" stop-opacity=".3"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="p3" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ffd166" stop-opacity="0"/>
    <stop offset=".55" stop-color="#ffd166" stop-opacity=".24"/>
    <stop offset="1" stop-color="#58a6ff" stop-opacity=".34"/>
  </linearGradient>
  <linearGradient id="p4" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#f472b6" stop-opacity="0"/>
    <stop offset=".5" stop-color="#f472b6" stop-opacity=".22"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity=".3"/>
  </linearGradient>
  <radialGradient id="blobA"><stop offset="0" stop-color="#58a6ff" stop-opacity=".3"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="blobB"><stop offset="0" stop-color="#a78bfa" stop-opacity=".26"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="blobC"><stop offset="0" stop-color="#f472b6" stop-opacity=".18"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#e6edf3" stop-opacity=".5"/><stop offset=".4" stop-color="#7ee787" stop-opacity=".25"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>
  <filter id="haze" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".005" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
  </filter>
  <g id="leaf1"><path d="M0 0 C 34 -70 62 -180 34 -290 C 16 -350 -16 -350 -34 -290 C -62 -180 -34 -70 0 0 Z" fill="url(#p1)"/></g>
  <g id="leaf2"><path d="M0 0 C 20 -80 34 -190 18 -270 C 8 -310 -8 -310 -18 -270 C -34 -190 -20 -80 0 0 Z" fill="url(#p2)"/><circle cx="0" cy="-205" r="9" fill="#e6edf3" opacity=".18"/></g>
  <g id="leaf3"><path d="M0 0 L 40 -110 L 8 -190 L -30 -120 Z" fill="url(#p3)"/></g>
  <g id="leaf4"><path d="M0 0 C 14 -60 24 -140 12 -196 C 4 -226 -4 -226 -12 -196 C -24 -140 -14 -60 0 0 Z" fill="url(#p4)"/></g>
</defs>

<g filter="url(#haze)" opacity=".85">
  <circle cx="265" cy="285" r="215" fill="url(#blobA)"/>
  <circle cx="770" cy="655" r="245" fill="url(#blobB)"/>
  <circle cx="650" cy="165" r="175" fill="url(#blobC)"/>
</g>

<g transform="translate(500 500) rotate(7)" filter="url(#warp)" opacity=".92">
  <g filter="url(#soft)">
    <use href="#leaf1" transform="rotate(0)"/>
    <use href="#leaf1" transform="rotate(90)"/>
    <use href="#leaf1" transform="rotate(180)"/>
    <use href="#leaf1" transform="rotate(270)"/>
    <use href="#leaf2" transform="rotate(30)"/>
    <use href="#leaf2" transform="rotate(120)"/>
    <use href="#leaf2" transform="rotate(210)"/>
    <use href="#leaf2" transform="rotate(300)"/>
    <use href="#leaf3" transform="rotate(60) scale(.92)"/>
    <use href="#leaf3" transform="rotate(150) scale(.92)"/>
    <use href="#leaf3" transform="rotate(240) scale(.92)"/>
    <use href="#leaf3" transform="rotate(330) scale(.92)"/>
    <circle r="54" fill="url(#core)"/>
    <circle r="118" fill="none" stroke="#58a6ff" stroke-opacity=".14" stroke-width="2"/>
    <circle r="206" fill="none" stroke="#a78bfa" stroke-opacity=".12" stroke-width="2"/>
    <circle r="318" fill="none" stroke="#7ee787" stroke-opacity=".09" stroke-width="2"/>
    <circle r="428" fill="none" stroke="#58a6ff" stroke-opacity=".06" stroke-width="2"/>
  </g>
</g>

<g transform="translate(592 452) scale(.64) rotate(-19)" filter="url(#soft)" opacity=".55">
  <use href="#leaf4" transform="rotate(0)"/>
  <use href="#leaf4" transform="rotate(51.4)"/>
  <use href="#leaf4" transform="rotate(102.8)"/>
  <use href="#leaf4" transform="rotate(154.2)"/>
  <use href="#leaf4" transform="rotate(205.6)"/>
  <use href="#leaf4" transform="rotate(257)"/>
  <use href="#leaf4" transform="rotate(308.4)"/>
  <circle r="330" fill="none" stroke="#f472b6" stroke-opacity=".08" stroke-width="2"/>
</g>

<g filter="url(#soft)" opacity=".4">
  <path d="M120 690 L 230 640 L 205 760 Z" fill="url(#p2)"/>
  <path d="M812 292 L 905 250 L 880 360 Z" fill="url(#p3)"/>
  <path d="M690 830 L 760 790 L 745 880 Z" fill="url(#p4)"/>
  <circle cx="170" cy="420" r="26" fill="url(#p3)" opacity=".5"/>
  <circle cx="840" cy="520" r="18" fill="url(#p1)" opacity=".5"/>
</g>

<rect width="1000" height="1000" filter="url(#grain)" opacity=".05"/>
</svg>
