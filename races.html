  {

    tg: 'Lost_Eld',
    blocks: [
      { t: 'p', text: 'Точных исторических данных о том, от какой расы произошли эти летучие мыши, нет. Однако большинство связывает их родство с элитрианцами по ключевым признакам: полые кости, крылья и любовь к открытым пространствам.' },
      { t: 'p', text: 'Летучие мыши делятся на два подвида: мыши-вампиры и фруктовые мыши.' },
      { t: 'p', text: 'В контексте мышей-вампиров, просто «вампир» обычно подразумевается, как мышь-вампир' },
      { t: 'h2', text: 'Мышь-вампир' },
      { t: 'h', text: 'Внешность и рацион' },
      { t: 'p', text: 'Социально-паразитический, вредительский вид летучих мышей с рационом из крови. Суточная норма — 700–900 мл для поддержания активной жизни. Рост — до 170 см. Внешность: гуманоидные летучие мыши среднего роста, с перепончатыми крыльями, звероподобными мордами, бледной кожей, острыми зубами и длинными языками, клыками и когтями,' },
      { t: 'h', text: 'Группа и здравый эгоизм' },
      { t: 'p', text: 'Держатся и охотятся группами из 3–7 особей; встречаются одиночки. Внутри группы развит здравый эгоизм: помощь оказывается в расчёте на ответную, а совместная охота безопаснее, когда умения членов группы примерно на одном уровне. Поэтому слишком старые, отстающие и те, кто только получает помощь и никогда не помогает сам, отсекаются — вплоть до исключения из группы. Слабых и стариков при угрозе могут использовать как приманку, чтобы обезопасить более способных.' },

      { t: 'p', text: 'Разные группы между собой обычно не враждуют: спор за добычу решается лидерами посредством деления (при согласии обоих), обмена ценностями или запасами крови, простой игрой или, редко, дракой.' },

      { t: 'h', text: 'Образ жизни и набеги' },
      { t: 'p', text: 'К размеренной жизни как вид практически не способны. Мыши-вампиры настолько часто попадают в неприятности или устраивают их сами, что почти стали синонимом неприятностей. Набеги никогда не имеют цели убийства: движущие мотивы — издевательства, выведение на эмоции, порча имущества и, конечно, кровь.' },
      { t: 'p', text: 'Ночь привычнее, но днём они тоже активны за счёт развитого полифазного сна, позволяющего спать короткими отрезками — иногда группе хватает десяти минут, а иногда вся группа может улететь в безопасное место чтобы поспать подольше.' },
      { t: 'p', text: 'Скука не слабее голода: устраивают засады, портят упряжь, развязывают скот, крадут мелочи, в том числе чтобы бросаться ими. Любят погонять жертву по переулкам и исчезнуть во тьме, смеясь во весь голос всей стаей.' },
      { t: 'p', text: 'Ставни и замки не всегда спасают, но повышают защиту: проще найти слабо подготовленное место, чем взламывать. Орудуют и на окраинах, и в крупных поселениях; при приближении крупных сил отступают.' },
      { t: 'p', text: 'На тех, кто бродит по улицам, мыши-вампиры нападают, только если вдвое превосходят числом: лишний риск им невыгоден. Но издёвки и словесные атаки — другое дело: здесь численность не важна.' },
      { t: 'h', text: 'Выживание и добыча крови' },
      { t: 'p', text: 'При таком образе жизни смертность у них высокая, и выживает вид за счёт двух вещей. Первая — высокая плодовитость. Вторая — умение становиться тихими и скрытными на охоте: если мышь-вампир хочет остаться незамеченной, особенно ночью, скорее всего, так и будет. В темноте они и так видят хорошо, поэтому эхолокация нужна им в основном для координации во время охоты и для пещер или помещений, где нет совсем никакого света. Команды вампиры отдают ультразвуковыми сигналами — группа координируется почти беззвучно для тех, кто не слышит этот диапазон.' },
      { t: 'p', text: 'Кровь добывают либо тихо, по одиночке, пока жертвы спят, либо группой, даже среди дня, набрасываясь сразу на одного-двух человек. Питаются и кровью скота, если не хотят рисковать. Укус почти незаметен: «вампирский яд» в слюне обезболивает, замедляет свёртывание крови и за счёт эйфории подавляет сопротивление, что лишь упрощает удержание жертвы, но не делает её беспомощной. После кормёжки вампир зализывает рану, останавливая кровотечение.' },
      { t: 'p', text: 'Из одной и той же жертвы дважды за раз мыши-вампиры не пьют, если только жертва не является крупной. Им выгоднее сохранить потенциальный источник пищи, чем убить его. Но в спешке или при плохой организованности, особенно если группа слишком неопытная, жертву может укусить несколько мышей, по ошибке лидера, и это иногда заканчивается смертью.' },
      { t: 'p', text: 'Мыши-вампиры также способны хранить запас крови, например в закупоренных колбах и иных подобных ёмкостях, или внутри себя, отрыгивая нуждающимся при отсутствии иных вариантов. Сбор «на запас» обычно осуществляют на фермах.' },
      { t: 'p', text: 'Некоторые опытные группы, не редко создают отдалённые подземные или пещерные тайники крови на случай плохих времён, или длительного отдыха в местах, где источников пищи может не хватить на всех. Иногда эти укрытия находят чужие, что приводит группу мышей-вампиров в ярость. Лучше вам не быть рядом в этот момент.' },

      { t: 'p', text: 'Прочие расы, мыши-вампиры воспринимают как источники пищи' },
      { t: 'h2', text: 'Фруктовая мышь' },
      { t: 'h', text: 'Внешность и рацион' },
      { t: 'p', text: 'Социальный и миролюбивый вид летучих мышей с полностью вегетарианским рационом. Суточная норма — 1,5–2 кг пищи. Рост — до 150 см. Внешне похожи на мышей-вампиров, но ниже, физически слабее и с человекоподобными или человеческими лицами. Когти у них присутствуют, но значительно меньше, чем у хищных собратьев.' },

      { t: 'p', text: 'В глубоком прошлом, фруктовые мыши отреклись от крови, с трудом перейдя на фруктово-овощную диету. Точную причину отречения никто не знает: возможно, упадок, возможно, религия, а может, просто необходимость. Возможно ли возвращение к крови — не их любимая тема, как и разговоры о крови в целом.' },
      { t: 'h', text: 'Среда, права и характер' },
      { t: 'p', text: 'Обитают как в лесах, так и среди обычного населения, живут на равных правах с большинством других рас. По возможности помогают друг другу и окружающим: уважение фруктовой мыши заслужить легко, а социальность позволяет быстро распространить его среди сородичей через сарафанное радио. Тот же эффект производит систематическое неоправданно плохое поведение.' },
      { t: 'p', text: 'Трудолюбивы — в уважении к своему и чужому труду, настойчивости в достижении целей и ответственности в работе. Любопытны — интересуются чужими культурами, историей, новостями в мире и прочим. Тактильны — касания для большинства из них часть обычного общения: между собой они почти не ограничивают друг друга, с другими расами стараются сдерживаться. В меру тихие — В отличие от шумных дальних родственников, не стремятся привлекать внимание, чтобы не вызывать ассоциаций с мышами-вампирами.' },
      { t: 'p', text: 'Жизнь с теми, кто слишком сильно отличается от их расы, предпочитают не связывать. Это не порицается: смешивания крови с непохожими они подсознательно избегают. Хотя мышей-вампиров как партнёров жизни не исключают: родство всё-таки берёт своё' },
      { t: 'h', text: 'Детёныши' },
      { t: 'p', text: 'Детёнышей фруктовые мыши выращивают в заботе, стараясь дать им всё необходимое для развития — и при этом удержать от избалованности. Забота сочетается с требовательностью: детям прививают трудолюбие и сдержанность, а не потакают капризам. Причина проста — будущее поколение может испортить впечатление о виде в целом.' },
      { t: 'p', text: 'Оглядываться при этом есть на что: мышей-вампиров манерам даже не пытаются учить — они не видят в других расах ничего, кроме пищи. Результат известен: общественное мнение против них. Фруктовые мыши считают это достаточным примером того, чего стоит избегать.' },
      { t: 'p', text: 'Обычно фруктовые мыши предпочитают растить детей самостоятельно, но при необходимости могут без проблем временно передать их другим фруктовым мышам — родственникам или соседям. Такая взаимовыручка в порядке вещей и не считается чем-то предосудительным.' },
      { t: 'h', text: 'Ночной образ жизни и путаница с вампирами' },
      { t: 'p', text: 'Любят открытые пространства и ночную тишину; иногда случайно пугают население, поскольку их нередко путают с мышами-вампирами — из-за любви к ночной жизни, силуэта, перепончатых крыльев и ушей летучей мыши. Ошибку быстро замечают, и фруктовые мыши не обижаются. При этом сами они как будто боятся стать такими же, как дальние родственники.' },
      { t: 'p', text: 'Сон у них может быть как обычным, так и полифазным, и перестраивать режим им не составляет труда — особенно если хочется проводить больше времени ночью, в тишине и без лишнего внимания, даже несмотря на ухудшение возможности видеть в темноте.' },
      { t: 'p', text: 'Эхолокацию фруктовые мыши практически утеряли — в нынешнем образе жизни она им почти не нужна. Но остаточная чувствительность сохранилась: иногда они слышат ультразвуковые сигналы, и этого достаточно, чтобы понять о приближении группы мышей-вампиров. При желании, фруктовая мышь могла-бы развить навык эхолокации, ведь у неё есть все задатки.' },
      { t: 'h', text: 'Отношение к мышам-вампирам' },
      { t: 'p', text: 'К мышам-вампирам фруктовые мыши относятся с жалостью: считают, что те застряли в цикле саморазрушения, жестокости и греха и нуждаются лишь в толчке, чтобы начать исправляться — как когда-то начали сами фруктовые мыши. Однако помогать им не торопятся и держатся в стороне, особенно на виду у других.' }
    ]
  },
  {

const listEl = document.getElementById('raceList');
const titleEl = document.getElementById('raceTitle');
const textEl = document.getElementById('raceText');
const metaEl = document.getElementById('raceMeta');

function renderRace(id) {
  const race = RACES.find(r => r.id === id) || RACES[0];
  titleEl.textContent = race.title || race.name;
  metaEl.textContent = '';
  if (race.author) {
    const author = document.createElement('div');
    author.className = 'race-author';
    author.textContent = 'Автор расы: ' + race.author;
    metaEl.append(author);
  }
  if (race.tg) {
    const contact = document.createElement('p');
    contact.className = 'race-contact';
    contact.append('Чтобы сделать персонажа с этой расой, напишите в Telegram: ');
    const link = document.createElement('a');
    link.href = 'https://t.me/' + race.tg;
    link.textContent = '@' + race.tg;
    link.target = '_blank';
    link.rel = 'noopener';
    contact.append(link);
    metaEl.append(contact);
  }
  textEl.textContent = '';
  const blocks = race.blocks || (race.text || []).map(par => ({ t: 'p', text: par }));
  blocks.forEach(block => {
    if (block.t === 'h2') {
      const h = document.createElement('h3');
      h.className = 'race-sub';
      h.textContent = block.text;
      textEl.append(h);
      return;
    }
    if (block.t === 'h') {
      const h = document.createElement('h3');
      h.textContent = block.text;
      textEl.append(h);
      return;
    }
    if (block.t === 'ul') {
      const ul = document.createElement('ul');
      block.items.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        ul.append(li);
      });
      textEl.append(ul);
      return;
    }
    const p = document.createElement('p');
    p.textContent = block.text;
    textEl.append(p);
  });
  [...listEl.children].forEach(btn => {
    const on = btn.dataset.id === race.id;
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(on));
  });
  if (location.hash.slice(1) !== race.id) history.replaceState(null, '', '#' + race.id);
}

RACES.forEach(race => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'race-item';
  btn.dataset.id = race.id;
  btn.textContent = race.name;
  btn.addEventListener('click', () => renderRace(race.id));
  listEl.append(btn);
});

renderRace(location.hash.slice(1));
window.addEventListener('hashchange', () => renderRace(location.hash.slice(1)));
</script>
